<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1096 512" width="1096" height="512" role="img" aria-labelledby="csp-title csp-desc">
<title id="csp-title">Production build of the apps/web room under strict CSP, before and after this fix</title>
<desc id="csp-desc">Before: vite build bundles Ajv and the authored schemas. In the browser, fixture.ts calls createWireValidator at module load, ajv.compile builds source text and calls new Function, the Content-Security-Policy script-src 'self' without 'unsafe-eval' blocks it, an EvalError is thrown before React mounts and the page stays blank. After: during vite build, in Node, Ajv standalone code generation turns every $defs component of the authored schemas into plain functions; the plugin resolves the import @agora/contracts to a virtual module that wraps them with wireValidatorOf; the browser runs that bundled validator with no compile and no Function under the same unchanged policy, validates the fixture and renders the room, or shows Fixture rejected for an invalid value.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="arrowhead" d="M0 0 L8 4 L0 8Z"/></marker></defs>
<style>
svg { --ink: #20332f; --muted: #52625d; --paper: #fafbf8; --line: #dce3dc; --surface: #ffffff; --wire: #708c7e; font-family: system-ui, -apple-system, sans-serif; }
@media (prefers-color-scheme: dark) { svg { --ink: #e6ece8; --muted: #a9b6b0; --paper: #141917; --line: #34403b; --surface: #1c2320; --wire: #7d9087; } }
.bg { fill: var(--paper); }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.rule { stroke: var(--line); stroke-width: 1; }
.divider { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
.arrow { stroke: var(--wire); stroke-width: 1.5; fill: none; }
.arrowhead { fill: var(--wire); }
.kicker { fill: var(--muted); font-size: 11px; letter-spacing: 1px; }
.lane { fill: var(--ink); font-size: 17px; font-weight: 600; }
.title { fill: var(--ink); font-size: 15px; font-weight: 600; }
.detail { fill: var(--muted); font-size: 12px; }
.mono { fill: var(--ink); font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; }
.note { fill: var(--muted); font-size: 12px; }
</style>
<rect class="bg" width="1096" height="512"/>
<g><text x="20" y="36" class="kicker">BEFORE THIS FIX</text><text x="20" y="60" class="lane">The bundle carries Ajv and compiles schemas in the page</text><path class="divider" d="M 224 72 V 208"/><text x="216" y="84" class="kicker" text-anchor="end">BUILD</text><text x="232" y="84" class="kicker">BROWSER UNDER CSP</text><g><rect class="box" x="20" y="96" width="192" height="104" rx="7"/><text x="34" y="120" class="kicker">BUILD · NODE</text><text x="34" y="143" class="title">vite build</text><text x="34" y="166" class="detail">bundles Ajv and the</text><text x="34" y="184" class="detail">authored schemas</text></g><g><rect class="box" x="236" y="96" width="192" height="104" rx="7"/><text x="250" y="120" class="kicker">BROWSER</text><text x="250" y="143" class="title">Module load</text><text x="250" y="166" class="detail">fixture.ts calls</text><text x="250" y="184" class="mono">createWireValidator()</text></g><g><rect class="box" x="452" y="96" width="192" height="104" rx="7"/><text x="466" y="120" class="kicker">BROWSER</text><text x="466" y="143" class="title">ajv.compile</text><text x="466" y="166" class="detail">builds source text, then</text><text x="466" y="184" class="mono">new Function(source)</text></g><g><rect class="box" x="668" y="96" width="192" height="104" rx="7"/><text x="682" y="120" class="kicker">BROWSER</text><text x="682" y="143" class="title">✕ CSP blocks it</text><text x="682" y="166" class="detail">script-src 'self' has</text><text x="682" y="184" class="detail">no 'unsafe-eval'</text></g><g><rect class="box" x="884" y="96" width="192" height="104" rx="7"/><text x="898" y="120" class="kicker">RESULT</text><text x="898" y="143" class="title">Blank page</text><text x="898" y="166" class="detail">EvalError before React</text><text x="898" y="184" class="detail">mounts; #root is empty</text></g><path class="arrow" d="M 214 148 H 233" marker-end="url(#arrow)"/><path class="arrow" d="M 430 148 H 449" marker-end="url(#arrow)"/><path class="arrow" d="M 646 148 H 665" marker-end="url(#arrow)"/><path class="arrow" d="M 862 148 H 881" marker-end="url(#arrow)"/></g>
<path class="rule" d="M 20 240 H 1076"/>
<g><text x="20" y="268" class="kicker">AFTER THIS FIX</text><text x="20" y="292" class="lane">Validators are plain code before the page loads</text><path class="divider" d="M 656 304 V 440"/><text x="648" y="316" class="kicker" text-anchor="end">BUILD</text><text x="664" y="316" class="kicker">BROWSER UNDER CSP</text><g><rect class="box" x="20" y="328" width="192" height="104" rx="7"/><text x="34" y="352" class="kicker">BUILD</text><text x="34" y="375" class="title">Authored schemas</text><text x="34" y="398" class="mono">contracts/schemas/</text><text x="34" y="416" class="detail">every $defs component</text></g><g><rect class="box" x="236" y="328" width="192" height="104" rx="7"/><text x="250" y="352" class="kicker">BUILD · NODE</text><text x="250" y="375" class="title">Ajv standalone</text><text x="250" y="398" class="mono">browserValidatorSource()</text><text x="250" y="416" class="detail">emits plain functions</text></g><g><rect class="box" x="452" y="328" width="192" height="104" rx="7"/><text x="466" y="352" class="kicker">BUILD</text><text x="466" y="375" class="title">Virtual module</text><text x="466" y="398" class="mono">@agora/contracts</text><text x="466" y="416" class="detail">import, served by the plugin</text></g><g><rect class="box" x="668" y="328" width="192" height="104" rx="7"/><text x="682" y="352" class="kicker">BROWSER</text><text x="682" y="375" class="title">Bundled validator</text><text x="682" y="398" class="mono">wireValidatorOf()</text><text x="682" y="416" class="detail">no compile, no Function</text></g><g><rect class="box" x="884" y="328" width="192" height="104" rx="7"/><text x="898" y="352" class="kicker">RESULT</text><text x="898" y="375" class="title">✓ Room renders</text><text x="898" y="398" class="detail">fixture validated first;</text><text x="898" y="416" class="detail">a bad value is rejected</text></g><path class="arrow" d="M 214 380 H 233" marker-end="url(#arrow)"/><path class="arrow" d="M 430 380 H 449" marker-end="url(#arrow)"/><path class="arrow" d="M 646 380 H 665" marker-end="url(#arrow)"/><path class="arrow" d="M 862 380 H 881" marker-end="url(#arrow)"/></g>
<text x="20" y="488" class="note">Both lanes ship the same policy, script-src 'self' with no 'unsafe-eval'. The dashed line is where the build ends and the browser starts.</text>
</svg>
