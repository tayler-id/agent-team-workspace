{
	"name": "agora-report",
	"on": {
		"workflow_run": {
			"workflows": [
				"agora-ci"
			],
			"types": [
				"completed"
			]
		}
	},
	"permissions": {
		"actions": "read",
		"contents": "read",
		"pull-requests": "read"
	},
	"concurrency": {
		"group": "agora-report-${{ github.event.workflow_run.id }}",
		"cancel-in-progress": false
	},
	"jobs": {
		"report": {
			"if": "${{ vars.AGORA_REPORTER_ENABLED == 'true' }}",
			"runs-on": "ubuntu-24.04",
			"timeout-minutes": 10,
			"environment": "agora-reporter",
			"steps": [
				{
					"uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
					"with": {
						"ref": "${{ github.event.repository.default_branch }}",
						"persist-credentials": false
					}
				},
				{
					"uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
					"with": {
						"node-version-file": ".node-version"
					}
				},
				{
					"run": "node scripts/trusted-report.mjs --run-id \"${{ github.event.workflow_run.id }}\" --json",
					"env": {
						"GITHUB_TOKEN": "${{ github.token }}",
						"AGORA_REPORTER_APP_KEY": "${{ secrets.AGORA_REPORTER_APP_KEY }}",
						"AGORA_REPORTING_SIGNING_KEY": "${{ secrets.AGORA_REPORTING_SIGNING_KEY }}"
					}
				}
			]
		}
	}
}
